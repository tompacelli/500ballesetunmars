<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 balles et un mars</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', 'Didot', 'Times New Roman', serif;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }
        
        .title {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #000000;
            animation: fadeInUp 1.2s ease-out forwards;
        }
        
        .subtitle {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1.5px;
            color: #666666;
            font-style: italic;
            animation: fadeInUp 1.2s ease-out forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }
        
        .logo {
            margin-top: 60px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888888;
            animation: fadeInUp 1.2s ease-out forwards;
            animation-delay: 0.6s;
            opacity: 0;
        }
        
        /* Subtle animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Border details */
        .border-detail {
            width: 40px;
            height: 1px;
            background-color: #d4d4d4;
            margin: 40px auto;
            animation: fadeInUp 1.2s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }
        
        /* Background animation */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(240,240,240,0.6));
            animation: gradientMove 6s infinite alternate;
            z-index: 1;
        }
        
        @keyframes gradientMove {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.2);
            }
        }
        
        /* Floating effect */
        .container > * {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        /* Media queries */
        @media (max-width: 375px) {
            .title {
                font-size: 60px;
            }
            
            .subtitle {
                font-size: 24px;
            }
        }
        
        @media (min-width: 768px) {
            .title {
                font-size: 86px;
            }
            
            .subtitle {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h1 class="title">500 balles</h1>
        <h2 class="subtitle">et un mars</h2>
        
        <div class="border-detail"></div>
        
        <div class="logo">
            <svg width="120" height="120" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <text x="150" y="120" font-family="Times New Roman, serif" font-size="60" text-anchor="middle" fill="#1a1a1a">ti-</text>
                <text x="150" y="200" font-family="Times New Roman, serif" font-size="60" text-anchor="middle" fill="#1a1a1a">titre.</text>
            </svg>
        </div>
    </div>
</body>
</html>
