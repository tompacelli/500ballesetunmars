<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>500 balles et un mars</title>
  <style>
    :root {
      --main-color: #000;
      --sub-color: #666;
      --font-family: 'Cormorant Garamond', 'Didot', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-family);
      color: var(--main-color);
      background-color: #fff;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px 20px 80px;
      text-align: center;
    }

    .title {
      font-size: 10vw;
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      color: var(--main-color);
      animation: fadeInUp 0.8s ease-out forwards, float 8s ease-in-out infinite;
    }

    .subtitle {
      font-size: 5.5vw;
      font-weight: 300;
      font-style: italic;
      color: var(--sub-color);
      letter-spacing: 1px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s forwards;
    }

    .border-detail {
      width: 40px;
      height: 1px;
      background-color: #d4d4d4;
      margin: 32px auto;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
    }

    .logo {
      margin-top: 48px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.9s forwards;
    }

    svg text {
      transition: transform 0.3s ease, fill 0.3s ease;
    }

    svg text:hover {
      fill: #003b2e;
      transform: scale(1.05);
    }

    .parallax-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 120vh;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      z-index: -1;
      opacity: 0.12;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    @media (min-width: 768px) {
      .title { font-size: 64px; }
      .subtitle { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="parallax-bg"></div>
  <div class="container">
    <h1 class="title">500 balles</h1>
    <h2 class="subtitle">et un mars</h2>
    <div class="border-detail"></div>
    <div class="logo">
      <svg width="120" height="120" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <text x="150" y="120" font-family="Times New Roman, serif" font-size="60" text-anchor="middle" fill="#1a1a1a">ti-</text>
        <text x="150" y="200" font-family="Times New Roman, serif" font-size="60" text-anchor="middle" fill="#1a1a1a">titre.</text>
      </svg>
    </div>
  </div>
</body>
</html>
